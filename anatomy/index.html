<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tickr oracle press</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><script>try{const m=matchMedia("(prefers-color-scheme: light)");const s=()=>{document.body.dataset.theme=m.matches?"light":"dark"};s();m.addEventListener("change",s)}catch(e){}</script><style>.iso .or-lamp { fill: var(--anatomy-faint); transition: fill 0.25s ease; }
.iso .or-lamp[data-on] { fill: var(--anatomy-lit); }
.iso .or-socket { fill: var(--anatomy-faint); transition: fill 0.3s ease; }
.iso .or-socket[data-on] { fill: var(--anatomy-lit); }
.iso .or-proof { opacity: 0; transition: opacity 0.18s ease; stroke-width: 0.9; }
.iso .or-proof[data-on] { opacity: 1; }
.iso .or-node { fill: var(--anatomy-lit); opacity: 0; transition: opacity 0.18s ease; }
.iso .or-node[data-on] { opacity: 1; }
.iso .or-seal { opacity: 0; transition: opacity 0.2s ease; }
.iso .or-seal[data-on] { opacity: 1; }
.iso .or-pulse { fill: var(--anatomy-lit); }
.iso [data-dim] { opacity: 0.45; transition: opacity 0.3s ease; }
.iso-stage[data-zoomed] svg {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 6%, #000 94%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 6%, #000 94%, transparent);
  mask-composite: intersect;
}
.or-views { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.or-views button { font: 12px/1.2 var(--anatomy-mono); color: var(--anatomy-muted); background: var(--anatomy-card); border: 1px solid var(--anatomy-faint); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.or-views button:hover { color: var(--anatomy-strong); border-color: var(--anatomy-lo); }
.or-views button[aria-pressed="true"] { color: var(--anatomy-strong); border-color: var(--anatomy-mid); }
.or-views button:focus-visible { outline: 1px solid var(--anatomy-hi); outline-offset: 2px; }
.or-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.iso .or-writer-leaf1 { opacity: 0; transition: opacity 0.18s ease; stroke-width: 0.9; }
.iso .or-writer-leaf1[data-on] { opacity: 0.55; }

.iso .or-store-card { fill: var(--anatomy-face); stroke: var(--anatomy-hi); stroke-width: 0.5; stroke-linejoin: round; }

.iso .or-vault-pinlamp[data-fail] { stroke: var(--anatomy-hi); stroke-width: 0.5; }

utton" data-view="overview" aria-pressed="true">Overview</button><button type="button" data-view="venues" aria-pressed="false">Venues</button><button type="button" data-view="writer" aria-pressed="false">Writer</button><button type="button" data-view="store" aria-pressed="false">Store and API</button><button type="button" data-view="relay" aria-pressed="false">Relayer</button><button type="button" data-view="vault" aria-pressed="false">Vault</button></nav><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Seal die and gantry: the signed report and the weighted mean it carries</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Rider discs: venue weights 4000, 4000 and 2000</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Cables: quotes in, leaves to the tree, the root to the header, the sealed report out</span></span><span class="iso-caption">Replayed at one fifth speed with simulated quotes every 100 ms. A venue counts only while it was heard from in the last 500 ms. When all three count, one more than 30 bps from their median is screened out, and two that remain must agree within 30 bps. With at least two left the leaf is VALID, otherwise UNSAFE, and the price is the weighted mean of what is left; an excluded venue comes back after 3 quotes that span at least 200 ms. Each report (every 200 ms on devnet) sorts the two configured feeds by feed ID into the 32-slot, five-level keccak tree, and the figure follows BTC/USDC in slot 0. The root goes into the header, which the single active signer seals with EIP-712 (“TickrOracle”, version 1), valid for 3 s. The store hands it to the API and the relayer. The relayer calls pushBatch on OracleVerifier at once on a status or source change or a 5 bps move from the accepted price, and otherwise early enough to land before the 1 s heartbeat; the replay sees each receipt 200 ms after its send.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

  quoteUs: 100_000,

const STATUS = ["VALID", "UNSAFE", "HALTED"];

// Reason flags, oracle-types leaf.rs:71-91.
const BIT = {

// One feed of the price engine, as feed.rs and source.rs: an excluded venue comes back only through the

function makeEngine() {

    if (s.window && !coherent(mid, s.window.ref, ORACLE.pairBps)) return exclude(s, BIT.OUTLIER_EXCLUDED);

    else if (priceChanged(priceOf(leaf), priceOf(a))) why = "deviation";

    if (why && !accepts) state.refused += 1;

      state.sentUs = tUs;
      state.nonce += 1;
      state.pending = null;
    }

// Replay choice: a tour sets a chain flag only while the active writer has a send in flight, so its revert
// shows; with a parked writer, or when clearing, the flag applies at once.
function chainFlagsAt(chain, want, { signed, inFlight }) {
  const setting = (want.halted && !chain.halted) || (want.revoked && !chain.revoked);
  return !setting || !signed || inFlight ? { halted: want.halted, revoked: want.revoked } : { halted: chain.halted, revoked: chain.revoked };
}

const earlyDispatchUs = (deadlineUs) => deadlineUs - ORACLE.workFloorUs - ORACLE.marginUs;

// decide.rs price_changed: |p - accepted| >= ceil(accepted * bps / 10000); a zero baseline moves on any nonzero price.
function priceChanged(price, accepted) {
  if (accepted === 0) return price !== 0;
  return Math.abs(price - accepted) >= (accepted * ORACLE.deviationBps) / 10_000;
}

// Deterministic quotes: a slow walk per venue plus a shared market move in bps.
function quoteAt(tUs, venue, moveBps) {

  const base = 67_250;
  const wander = [Math.sin(t * 0.9) * 1.1 + Math.sin(t * 2.3) * 0.5, Math.sin(t * 0.7 + 1.3) * 1.2 + Math.sin(t * 1.9) * 0.4, Math.sin(t * 1.1 + 2.1) * 1.4 + Math.sin(t * 2.9) * 0.6][venue];

const D = {"P":{"origin":[300,188.65955559091137],"scale":0.9824663637843473,"azimuth":58,"elevation":30},"W":600,"H":360,"views":[{"key":"overview","label":"Overview","camera":[0,0,600,360],"caption":"Replayed at one fifth speed with simulated quotes every 100 ms. A venue counts only while it was heard from in the last 500 ms. When all three count, one more than 30 bps from their median is screened out, and two that remain must agree within 30 bps. With at least two left the leaf is VALID, otherwise UNSAFE, and the price is the weighted mean of what is left; an excluded venue comes back after 3 quotes that span at least 200 ms. Each report (every 200 ms on devnet) sorts the two configured feeds by feed ID into the 32-slot, five-level keccak tree, and the figure follows BTC/USDC in slot 0. The root goes into the header, which the single active signer seals with EIP-712 (“TickrOracle”, version 1), valid for 3 s. The store hands it to the API and the relayer. The relayer calls pushBatch on OracleVerifier at once on a status or source change or a 5 bps move from the accepted price, and otherwise early enough to land before the 1 s heartbeat; the replay sees each receipt 200 ms after its send."},{"key":"venues","label":"Venues","camera":[7.7,10.4,369.8,221.9],"caption":"Eleven lamps on the rail head show the leaf's reason bits, 0 to 10, with a tick every fourth. Under each lane, on the rail head, three pips and a 200 ms slider count a venue's way back: it needs 3 quotes within 30 bps of its first, spanning at least 200 ms. Each tower's dial steps through the reconnect wait, 100 ms doubling to a 5 s cap, zero when live; the replay starts it as soon as a venue goes silent and skips the 5 s silence timeout that comes first. Binance's tag lights while the leaf marks it receive-timed: its quotes carry no venue time, so the oracle stamps them on arrival. While the writer is parked the real oracle reads the venues and drops their quotes; the replay's price engine keeps running ueue per WebSocket, a 64-report backfill window. In the replay a segment closes every 16 reports, three lit permits stand for open connections, and one token check runs per report."},{"key":"relay","label":"Relayer","camera":[321.3,203.1,150.2,90.1],"caption":"The relayer sends a report early enough to land before the 1 s heartbeat. On the ruler, the cursor runs from the last receipt toward the deadline; the early send point sits the remaining work plus a 175 ms margin before it (the replay uses the 100 ms starting bound; a running relayer measures signing and submission). A status or source change, or a 5 bps move, on either feed sends at once. Each send loads both feeds into the rack as one pushBatch transaction and turns the nonce wheel one tooth; the receipt renews the deadline. If the chain would reject it, the gas estimate fails first: the latch drops and nothing is sent or renewed. A send already in flight when the chain halts is mined and reverts: the latch drops, the nonce stays used, nothing renews. A parked writer sends nothing. Replay choices: the 200 ms receipt lag, the latch's 0.9 s hold, a halt set only while a send is in flight, and a halt cleared at once, with no resume, at the loop start or on a hover, a key or a view change."},{"key":"vault","label":"Vault","camera":[376.9,169.1,198.6,119.1],"caption":"Each send is one pushBatch. The eleven pins are OracleVerifier's checks in order: protocol, epoch, config, revoke and signature, sizes, the 3 s format, Merkle proofs, completeness, epoch and sequence order, halt, expiry. A failed pin stays down and later pins never run; halt comes after order, so it fails tenth. The relayer's gas estimate runs the same checks as a dry run, so a halted or revoked vault fails there and nothing is sent; a send already in flight when the flag flips is mined and reverts at that pin. All up: the bolt slides, then the lamp blinks. A guardian key halts or revokes; only the admin key resumes or activates an epoch, which clea const SPEED = 0.2;
const REF = 67_250;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const captionEl = document.querySelector(".iso-caption");
const buttons = [...document.querySelectorAll(".or-views [data-view]")];
const still = matchMedia("(prefers-reduced-motion: reduce)");
const $ = (sel) => svg.querySelector(sel);
const $$ = (sel) => [...svg.querySelectorAll(sel)];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
const on = (el, flag) => (flag ? el.setAttribute("data-on", "") : el.removeAttribute("data-on"));
const bpsOf = (price) => (price / REF - 1) * 10_000;
const STATION_LIVE = {};

// A needle on a dial top, from build data { cx, cy, top, len }.
function needle(el, d, angle) {
  const s = Math.sin(angle), c = Math.cos(angle);
  el.setAttribute("d", lineOnTop([d.cx - s * 1.2, d.cy + c * 1.2], [d.cx + s * d.len, d.cy - c * d.len], d.top, D.P));
}

// Pulses ride the cables: one dot per chunk, shown only in the chunk the pulse is in, so it keeps that chunk's depth.
const pulses = Object.fromEntries(Object.entries(D.routes).map(([name, route]) => {
  const dots = [...svg.querySelectorAll(`[data-route="${name}"][data-chunk]`)].map((group) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    el.setAttribute("class", "or-pulse");
    el.setAttribute("r", "1.3");
    el.setAttribute("opacity", "0");
    group.appendChild(el);
    return { el, s0: Number(group.dataset.s0), s1: Number(group.dataset.s1) };
  });
  return [name, { ...route, dots, shown: null }];
}));
function pulse(name, t) {
  const p = pulses[name];
  const s = t * p.total;
  const dot = t > 0 && t < 1 ? p.dots.find((d) => s >= d.s0 && s < d.s1) : null;
  if (p.shown && p.shown !== dot) p.shown.el.setAttribute("opacity", "0");
  p.shown = dot;
  if (!dot) return;
  let i = 1;
  while (i < p.s.length - 1 && p.s[i] < s) i++;
  const f = clamp((s - p.s[i - 1]) / (p.s[i] - p.s[i - 1] || 1), 0, 1);
  dot.el.setAttribute("cx", (p.pts[i - 1][0] + (p.pts[i][0] - p.pts[i - 1][0]) * f).toFixed(2));
  dot.el.setAttribute("cy", (p.pts[i - 1][1] + (p.pts[i][1] - p.pts[i - 1][1]) * f).toFixed(2));
  dot.el.setAttribute("opacity", Math.min(1, t / 0.12, (1 - t) / 0.12).toFixed(2));
}

// Scenario: a tour in real seconds, or the reader's pointer and keys. A station may bring its own tour.
// Fields: move (bps), stale (venues), skew (Bybit bps), halt (off-chain latch), chain ({ halted, revoked }).
const TOUR = [
  { until: 8, move: 0, stale: [], skew: 0, say: "calm market: heartbeat sends" },
  { until: 16, move: 12, stale: [], skew: 0, say: "market rises: 5 bps sends" },
  { until: 24, move: 12, stale: [2], skew: 0, say: "Bybit stale: source set changes" },
  { until: 32, move: 12, stale: [], skew: 45, say: "Bybit 45 bps out: screened out" },
  { until: 40, move: 0, stale: [1, 2], skew: 0, say: "two venues stale: UNSAFE" },
];
let view = "overview";
let touring = !still.matches;
let tourClock = 0;
let idle = 0;
const manual = { move: 0, stale: new Set() };
let moveNow = 0;
const tourOf = () => (view !== "overview" && STATION_LIVE[view]?.tour) || TOUR;
function scene() {
  if (touring) {
    const tour = tourOf();
    const t = tourClock % tour[tour.length - 1].until;
    return tour.find((s) => t < s.until);
  }
  return { move: manual.move, stale: [...manual.stale], skew: 0, say: "your market" };
}

// Model state: one engine and one relayer for the followed feed, and the chain's halt and revoke flags.
const engine = makeEngine();
const relayer = makeRelayer();
const chain = { halted: false, revoked: false };
let simUs = 0;
let quoteIndex = -1;
let reportIndex = -1;
let seq = 0;
let leaf = null;
let sent = null;
let lastSent = "first";
let halted = false;
// The writer signs only while the chain shows it unrevoked and unhalted (validation.rs:83-92); in the replay
// it sees a change one report late. A send the chain would reject fails at the gas estimate (publisher.rs:518).
let signed = true;
let refused = false;
let reverted = false;
let writerSees = { halted: false, revoked: false };
let heldBy = null;
const REASON = { first: "first", priority: "priority", deviation: "5 bps", heartbeat: "heartbeat" };
const SAY = { first: "first report", priority: "a status or source change", deviation: "a 5 bps move", heartbeat: "the heartbeat" };

function quotes(tUs, sc) {
  [0, 1, 2].forEach((v) => {
    if (!sc.stale.includes(v)) engine.ingest(v, quoteAt(tUs, v, moveNow) * (v === 2 ? 1 + sc.skew / 10_000 : 1), tUs);
  });
}

function report(tUs, sc) {
  if (Boolean(sc.halt) !== halted) {
    halted = Boolean(sc.halt);
    halted ? engine.halt() : engine.resume();
  }
  const want = { halted: Boolean(sc.chain?.halted), revoked: Boolean(sc.chain?.revoked) };
  const flags = chainFlagsAt(chain, want, { signed: !writerSees.halted && !writerSees.revoked, inFlight: Boolean(relayer.state.inFlight) });
  chain.halted = flags.halted;
  chain.revoked = flags.revoked;
  const shown = leaf ? leaf.shown : REF;
  leaf = { ...engine.evaluate(tUs), at: tUs };
  leaf.shown = leaf.price ?? shown;
  heldBy = writerSees.revoked ? "signer revoked" : writerSees.halted ? "chain halted" : null;
  signed = heldBy === null;
  writerSees = { halted: chain.halted, revoked: chain.revoked };
  const accepts = !chain.halted && !chain.revoked;
  const before = { refused: relayer.state.refused, reverted: relayer.state.reverted };
  // A parked writer builds and sends nothing (coordinator.rs:327-334); a send already in flight still lands.
  if (signed) sent = relayer.onReport(leaf, tUs, accepts);
  else { relayer.poll(tUs, accepts); sent = null; }
  refused = relayer.state.refused > before.refused;
  reverted = relayer.state.reverted > before.reverted;
  if (sent && !refused) lastSent = sent;
  if (signed) seq += 1;
  const price = leaf.price === null ? "no price" : leaf.price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // VALID counts the venues in the price; otherwise the usable ones (fresh and not excluded).
  const isValid = leaf.status === 0;
  const count = [0, 1, 2].filter((v) => (isValid ? leaf.used[v] : leaf.fresh[v] && !engine.isExcluded(v))).length;
  const tail = refused && reverted ? "send reverted · estimate failed" : refused ? "gas estimate failed, nothing sent" : reverted ? "last send reverted" : `last: ${REASON[lastSent]}`;
  const outcome = [reverted && "the send in flight was mined after the flag and reverted", refused && "the gas estimate failed, so nothing new was sent"].filter(Boolean).join(", and ") || `last sent on ${SAY[lastSent]}`;
  let text;
  if (signed) {
    const venues = leaf.status === 2 ? "" : ` ${count}/3${isValid ? "" : " usable"}`;
    text = `#${seq} · ${price} · ${STATUS[leaf.status]}${venues} · ${tail}`;
    status.textContent = `${sc.say}. Report ${seq}: ${price}, ${STATUS[leaf.status]}${leaf.status === 2 ? "" : ` ${isValid ? "from" : "with"} ${count} of 3 venues${isValid ? "" : " usable"}`}; ${outcome}.`;
  } else {
    text = `#${seq} · writer parked: ${heldBy}${reverted ? " · last send reverted" : ""}`;
    status.textContent = `${sc.say}. The writer is parked and sends nothing while the ${heldBy === "chain halted" ? "chain is halted" : "signer is revoked"}${reverted ? "; the send in flight reverted" : ""}; the last report was ${seq}.`;
  }
  if (readout.textContent !== text) readout.textContent = text;
}

// Camera: each view is a viewBox; the move eases, and reduced motion jumps.
const cam = D.views[0].camera.slice();
let camTarget = cam.slice();
function setView(key, { push = true } = {}) {
  const v = D.views.find((x) => x.key === key) ?? D.views[0];
  view = v.key;
  camTarget = v.camera.slice();
  buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  if (captionEl) captionEl.textContent = v.caption;
  stage.toggleAttribute("data-zoomed", view !== "overview");
  touring = !still.matches;
  tourClock = 0;
  if (push) history.replaceState(null, "", view === "overview" ? location.pathname + location.search : `#${view}`);
  if (still.matches) frame0();
  run();
}

function draw(phase, dt) {
  const follow = (from, to, tau) => (still.matches ? to : from + (to - from) * (1 - Math.exp(-dt / tau)));
  for (let i = 0; i < 4; i++) cam[i] = follow(cam[i], camTarget[i], 0.45);
  svg.setAttribute("viewBox", cam.map((v) => v.toFixed(2)).join(" "));
  [0, 1, 2].forEach((v) => pulse(`cable.venue${v}`, leaf.fresh[v] ? (phase + 0.12) / 0.2 : -1));
  pulse("cable.leaves", signed ? phase / 0.12 : -1);
  pulse("cable.tick", signed ? (phase - 0.02) / 0.1 : -1);
  pulse("cable.root", signed ? (phase - 0.42) / 0.14 : -1);
  pulse("cable.store", signed ? (phase - 0.68) / 0.14 : -1);
  pulse("cable.api", signed ? (phase - 0.82) / 0.12 : -1);
  pulse("cable.relay", signed ? (phase - 0.82) / 0.1 : -1);
  pulse("cable.chain", sent && !refused ? (phase - 0.9) / 0.09 : -1);
  const ctx = { phase, dt, follow, leaf, sent, refused, reverted, signed, heldBy, seq, relayer: relayer.state, engine, chain, scene: lastScene, view, simUs };
  for (const [key, st] of Object.entries(STATION_LIVE)) st.draw?.({ ...ctx, active: view === key });
}

let frame = 0, last = 0, visible = false, lastScene = null;
function step(dt) {
  if (touring) tourClock += dt;
  else if ((idle -= dt) <= 0 && !still.matches) { touring = true; tourClock = 0; }
  lastScene = scene();
  moveNow += (lastScene.move - moveNow) * (1 - Math.exp(-dt / 1.5));
  simUs += dt * 1e6 * SPEED;
  for (let q = quoteIndex + 1; q <= Math.floor(simUs / ORACLE.quoteUs); q++) {
    quoteIndex = q;
    const tUs = q * ORACLE.quoteUs;
    quotes(tUs, lastScene);
    if (tUs % ORACLE.periodUs === 0) { reportIndex = tUs / ORACLE.periodUs; report(tUs, lastScene); }
  }
  draw((simUs % ORACLE.periodUs) / ORACLE.periodUs, dt);
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  step(dt);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
// Under reduced motion a manual change jumps the replay one second ahead and draws the settled still.
function advanceStill() {
  for (let i = 0; i < 1e6 / (ORACLE.periodUs * SPEED); i++) step(ORACLE.periodUs / 1e6);
  frame0();
}
const takeOver = () => { touring = false; idle = 6; still.matches ? advanceStill() : run(); };

// The resting still: the ram is down on the seal and no pulse is in flight, which is also the reduced-motion frame.
function frame0() {
  lastScene = scene();
  draw(0.68, 1);
}

function boot() {
  new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; run(); }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointermove", (event) => {
    const box = svg.getBoundingClientRect();
    manual.move = clamp(((event.clientX - box.left) / box.width - 0.5) * 2, -1, 1) * 18;
    takeOver();
  });
  stage.addEventListener("keydown", (event) => {
    if (["1", "2", "3"].includes(event.key)) {
      const v = Number(event.key) - 1;
      manual.stale.has(v) ? manual.stale.delete(v) : manual.stale.add(v);
    } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
      manual.move = clamp(manual.move + (event.key === "ArrowRight" ? 3 : -3), -18, 18);
    } else if (event.key === "Escape") {
      manual.stale.clear(); manual.move = 0;
      setView("overview");
      return;
    } else return;
    event.preventDefault();
    takeOver();
  });
  buttons.forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  addEventListener("hashchange", () => setView(location.hash.slice(1), { push: false }));
  // Warm the model through two reports so the first frame shows a settled leaf.
  lastScene = scene();
  for (let q = 0; q <= 2; q++) { quoteIndex = q; quotes(q * ORACLE.quoteUs, lastScene); if (q % 2 === 0) report(q * ORACLE.quoteUs, lastScene); }
  simUs = 2 * ORACLE.quoteUs + ORACLE.periodUs * 0.68;
  const start = location.hash.slice(1);
  if (D.views.some((v) => v.key === start && start !== "overview")) {
    setView(start, { push: false });
    cam.splice(0, 4, ...camTarget);
  }
  frame0();
}
// Venues station: riders slide to each venue's mid, the gantry follows the weighted mean, lamps show freshness.
{
  const S = D.stations.venues;
  const riders = [0, 1, 2].map((i) => $(`[data-part="rider${i}"]`));
  const gantry = [0, 1, 2].map((i) => $(`[data-part="gantry${i}"]`));
  const lamps = [0, 1, 2].map((i) => $(`[data-lamp="${i}"]`));
  const bits = Array.from({ length: 11 }, (_, i) => $(`[data-venues-bit="${i}"]`));
  const pips = [0, 1, 2].map((v) => [0, 1, 2].map((j) => $(`[data-venues-pip="${v}.${j}"]`)));
  const slides = [0, 1, 2].map((v) => $(`[data-part="venues-span${v}"]`));
  const needles = [0, 1, 2].map((v) => $(`[data-venues-needle="${v}"]`));
  const tag = $('[data-venues-tag="0"]');
  // Per venue: when its stale run began, when its recovery window began, the readmit flash, the dial angle.
  const gate = [0, 1, 2].map(() => ({ staleAt: null, windowAt: null, wasExcluded: false, flash: 0, slide: 0, angle: S.dials[0].start }));
  // Waiting delay after n ms of silence: the step whose cumulative wait has not yet elapsed.
  const stepAt = (ms) => {
    let end = 0;
    const index = S.BACKOFF_MS.findIndex((wait) => (end += wait) > ms);
    return index < 0 ? S.BACKOFF_MS.length : index + 1; // the last step is the 5 s cap, held
  };
  const x = { rider: [S.XC, S.XC, S.XC], gantry: S.XC };
  STATION_LIVE.venues = {
    tour: [
      { until: 6, move: 0, stale: [], skew: 0, say: "calm: every reason lamp is dark" },
      { until: 27, move: 0, stale: [2], skew: 0, say: "Bybit stale: bit 0 lights, its rider parks, its backoff dial steps up" },
      { until: 37, move: 0, stale: [], skew: 0, say: "Bybit returns: the pips fill until it is readmitted" },
      { until: 47, move: 0, stale: [], skew: 45, say: "Bybit 45 bps out: bit 1; it qualifies against its own first quote and the median screens it again" },
      { until: 81, move: 0, stale: [1, 2], skew: 0, say: "two venues stale: UNSAFE, bit 10 on the first one only, dials climb to the 5 s cap" },
      { until: 91, move: 0, stale: [], skew: 0, say: "the venues return and qualify again" },
      { until: 97, move: 0, stale: [], skew: 0, halt: true, say: "operator halt: the leaf reads HALTED with bit 8 and no price" },
    ],
    draw({ leaf, follow, dt, engine, scene, simUs }) {
      for (let i = 0; i < 11; i++) on(bits[i], (leaf.flags >> i) & 1);
      on(tag, leaf.rxMask & 1);
      [0, 1, 2].forEach((v) => {
        const g = gate[v];
        const stale = Boolean(scene?.stale?.includes(v));
        if (!stale) g.staleAt = null;
        else g.staleAt ??= simUs;
        const dial = S.dials[v];
        g.angle = follow(g.angle, dial.start + (stale ? stepAt((simUs - g.staleAt) / 1000) : 0) * dial.step, 0.12);
        needle(needles[v], dial, g.angle);
        const excluded = engine.isExcluded(v);
        const count = engine.qualifying(v);
        if (g.wasExcluded && !excluded) g.flash = 0.9;
        g.wasExcluded = excluded;
        g.flash = excluded ? 0 : Math.max(0, g.flash - dt);
        if (excluded && count > 0) g.windowAt ??= simUs;
        else g.windowAt = null;
        const span = excluded ? (g.windowAt === null ? 0 : clamp((simUs - g.windowAt) / ORACLE.confirmSpanUs, 0, 1)) : g.flash > 0 ? 1 : 0;
        pips[v].forEach((pip, j) => on(pip, excluded ? j < count : g.flash > 0));
        g.slide = follow(g.slide, span * S.SPAN_TRAVEL, 0.08);
        slides[v].setAttribute("transform", translateAlong(D.P, [0, g.slide, 0]));
      });
      leaf.used.forEach((used, i) => {
        const target = used ? S.XC + clamp(bpsOf(leaf.mids[i]), -S.RANGE, S.RANGE) * S.U : S.PARK;
        x.rider[i] = follow(x.rider[i], target, 0.25);
        riders[i].setAttribute("transform", translateAlong(D.P, [x.rider[i] - S.XC, 0, 0]));
        used ? riders[i].removeAttribute("data-dim") : riders[i].setAttribute("data-dim", "");
        on(lamps[i], leaf.fresh[i]);
      });
      x.gantry = follow(x.gantry, S.XC + clamp(bpsOf(leaf.shown), -S.RANGE, S.RANGE) * S.U, 0.3);
      gantry.forEach((g) => g.setAttribute("transform", translateAlong(D.P, [x.gantry - S.XC, 0, 0])));
    },
  };
}

// Writer station: the tree lights level by level, the sequence drums roll at allocation, the key turns as the ram strokes the seal.
{
  const S = D.stations.writer;
  const ram = $('[data-part="ram"]');
  const die = $('[data-part="die"]');
  const seal = $(".or-seal");
  const proofs = $$(".or-proof");
  const nodes = $$(".or-node");
  const leafEdge = $(".or-writer-leaf1");
  const clockNeedle = $('[data-part="needle2"]');
  const lamp = (tag) => $(`[data-writer-lamp="${tag}"]`);
  const lamps = { leaf0: lamp("leaf0"), leaf1: lamp("leaf1"), tick: lamp("tick"), journal: lamp("journal"), lease: lamp("lease"), permit: lamp("permit") };
  const keyBar = $("[data-writer-key]");
  const arm = $("[data-writer-arm]");
  const digits = [0, 1, 2, 3].map((i) => ["a", "b"].map((slot) => $(`[data-writer-digit="${i}"][data-slot="${slot}"]`)));
  const { key, latch } = S.kms;
  const { drum, baseline, drop } = S.reg;
  const digitOf = (n, i) => Math.floor(n / 10 ** (3 - i)) % 10;
  const place = (el, i, offset) => el.setAttribute("transform", `translate(${(drum * (i + 0.5)).toFixed(2)} ${(baseline + offset).toFixed(2)})`);
  const lastText = new Map();
  const setText = (el, value) => {
    if (lastText.get(el) !== value) { el.textContent = value; lastText.set(el, value); }
  };
  STATION_LIVE.writer = {
    tour: [
      { until: 8, move: 0, stale: [], skew: 0, say: "permit held: the key turns and the die seals" },
      { until: 14, move: 0, stale: [], skew: 0, chain: { halted: true }, say: "chain halted: one report later the writer parks, drops the lease and builds and seals nothing" },
      { until: 20, move: 0, stale: [], skew: 0, chain: { revoked: true }, say: "signer revoked: the writer stays parked with no lease and builds nothing" },
    ],
    draw({ phase, seq, chain, signed }) {
      // The writer sees a halt or revoke one report late; then it parks, so lease, latch and seal all follow `signed`.
      const permitOk = signed;
      // A parked writer builds no leaves and no tree (coordinator.rs:327-334).
      proofs.forEach((p) => on(p, signed && phase > 0.1 + Number(p.dataset.level) * 0.07));
      nodes.forEach((n) => on(n, signed && phase > 0.13 + Number(n.dataset.level) * 0.07));
      on(leafEdge, signed && phase > 0.17);
      on(lamps.leaf0, signed && phase > 0.06);
      on(lamps.leaf1, signed && phase > 0.1);
      on(lamps.tick, signed && phase < 0.12);
      // Sequence: the drums show the last allocated number until the journal row is written, then roll to this report's.
      const current = Math.max(seq, 1) % 10000;
      const previous = signed ? Math.max(seq, 1) - 1 : current;
      const roll = ease((phase - 0.46) / 0.08);
      digits.forEach(([a, b], i) => {
        const from = digitOf(previous % 10000, i);
        const to = digitOf(current, i);
        if (from === to) {
          setText(a, from); b.setAttribute("opacity", "0"); place(a, i, 0);
          return;
        }
        setText(a, from); setText(b, to);
        b.setAttribute("opacity", "1");
        place(a, i, -roll * drop);
        place(b, i, (1 - roll) * drop);
      });
      on(lamps.journal, signed && phase > 0.47 && phase < 0.68);
      on(lamps.lease, signed);
      on(lamps.permit, permitOk && phase > 0.5 && phase < 0.7);
      const stroke = phase < 0.55 ? 0 : phase < 0.68 ? ease((phase - 0.55) / 0.13) : ease(1 - (phase - 0.7) / 0.22);
      const turn = permitOk ? stroke : 0;
      const down = [0, 0, -S.ram.down * turn];
      ram.setAttribute("transform", translateAlong(D.P, down));
      die.setAttribute("transform", translateAlong(D.P, down));
      on(seal, permitOk && phase > 0.66);
      const a = turn * Math.PI / 2;
      const end = (sign) => iso([key.x + sign * key.r * Math.sin(a), key.y - sign * key.r * Math.cos(a), key.z], D.P);
      keyBar.setAttribute("d", pathOf([end(-1), end(1)]));
      const open = signed ? 0 : 1.2;
      const tip = iso([latch.x, latch.py - latch.len * Math.cos(open), latch.pz + latch.len * Math.sin(open)], D.P);
      arm.setAttribute("d", pathOf([iso([latch.x, latch.py, latch.pz], D.P), tip]));
      needle(clockNeedle, S.clock, signed ? Math.PI * 2 * phase : 0);
    },
  };
}

// Store and API station: journal spool, fsync lamp, archive drop, token check, request window, sockets.
{
  const S = D.stations.store;
  const p3 = (x, y, z) => iso([x, y, z], D.P);
  const sockets = $$("[data-socket]");
  const spool = $('[data-part="spool"]');
  const pawl = $('[data-part="pawl"]');
  const fsync = $('[data-lamp="fsync"]');
  const archiveLamp = $('[data-lamp="archive"]');
  const card = $("[data-store-card]");
  const marker = $("[data-store-marker]");
  const wheel = $('[data-part="wheel"]');
  const SEGMENT_REPORTS = 16; // replay choice, not a code constant

  const spoolTicks = (angle) => Array.from({ length: S.spool.ticks }, (_, i) => {
    const a = angle + (i / S.spool.ticks) * Math.PI * 2;
    const { cx, cy, rIn, rOut, top } = S.spool;
    return lineOnTop([cx + Math.sin(a) * rIn, cy - Math.cos(a) * rIn], [cx + Math.sin(a) * rOut, cy - Math.cos(a) * rOut], top, D.P);
  }).join("");
  const wheelTicks = (angle) => {
    const w = S.wheel;
    return Array.from({ length: w.ticks }, (_, i) => {
      const a = angle + (i / w.ticks) * Math.PI * 2;
      const r0 = i % w.every === 0 ? w.rMajor : w.rIn;
      return pathOf([p3(w.cx + Math.sin(a) * r0, w.y, w.cz - Math.cos(a) * r0), p3(w.cx + Math.sin(a) * w.rOut, w.y, w.cz - Math.cos(a) * w.rOut)]);
    }).join("");
  };

  STATION_LIVE.store = {
    draw({ phase, seq, simUs, signed }) {
      // Only a sealed report drives the journal, the archive, the sockets and the token check.
      sockets.forEach((s, i) => on(s, signed && (phase > 0.92 + i * 0.03 || phase < 0.04)));
      // Journal append: the spool steps one tick per report as the sealed report arrives, never back.
      const append = signed ? clamp((phase - 0.7) / 0.1, 0, 1) : 1;
      spool.setAttribute("d", spoolTicks((((seq - 1 + ease(append)) % S.spool.ticks) / S.spool.ticks) * Math.PI * 2));
      pawl.setAttribute("transform", translateAlong(D.P, [0, 0.8 * Math.sin(Math.PI * append), 0]));
      on(fsync, signed && phase >= 0.8 && phase < 0.98);
      // Segment card: leaves the spout and drops into the archive slot every few reports.
      const c = S.card;
      const u = signed && seq % SEGMENT_REPORTS === 0 ? (phase - 0.84) / 0.12 : -1;
      const bottom = c.spoutZ - c.fall * u * u;
      const z0 = Math.max(c.lidTop + 0.1, bottom);
      const z1 = Math.min(c.spoutZ, bottom + c.cardLen);
      const falling = u > 0 && u < 1 && z1 > z0;
      card.setAttribute("opacity", falling ? "1" : "0");
      if (falling) card.setAttribute("d", pathOf([p3(c.cardX0, c.y, z0), p3(c.cardX1, c.y, z0), p3(c.cardX1, c.y, z1), p3(c.cardX0, c.y, z1)], true));
      on(archiveLamp, signed && ((seq % SEGMENT_REPORTS === 0 && phase > 0.95) || (seq % SEGMENT_REPORTS === 1 && phase < 0.1)));
      // Token check: the marker walks the whole hash ring while the API pulse runs, with no early exit.
      const check = signed ? clamp((phase - 0.82) / 0.12, 0, 1) : 0;
      const a = check * Math.PI * 2;
      const r = (S.auth.rIn + S.auth.rOut) / 2;
      const m = p3(S.auth.cx + Math.sin(a) * r, S.auth.y, S.auth.cz - Math.cos(a) * r);
      marker.setAttribute("cx", m[0].toFixed(2));
      marker.setAttribute("cy", m[1].toFixed(2));
      on(marker, check > 0 && check < 1);
      // Request window: one turn per second of simulated time.
      wheel.setAttribute("d", wheelTicks(((simUs / 1e6) % 1) * Math.PI * 2));
    },
  };
}

// Relayer station: dials, a timing ruler cursor, lamps, a batch rack, a nonce wheel and a revert latch, all from the relayer state.
{
  const S = D.stations.relay;
  const needles = [0, 1].map((i) => $(`[data-part="needle${i}"]`));
  const cursor = $$('[data-part="cursor"]');
  const tiles = [0, 1].map((i) => $(`[data-part="tile${i}"]`));
  const bolt = $$('[data-part="bolt"]');
  const teeth = $('[data-part="teeth"]');
  const lamps = Object.fromEntries(["flight", "receipt", "reverted"].map((n) => [n, $(`[data-lamp="relay-${n}"]`)]));
  const slide = (els, dx) => els.forEach((el) => el.setAttribute("transform", translateAlong(D.P, [dx, 0, 0])));
  const x = { cursor: 0, tile: [0, 0], bolt: 0, wheel: 0 };
  const seen = { receiptUs: undefined, failed: undefined, receiptFlash: 0, latchHold: 0, latchDue: false };
  STATION_LIVE.relay = {
    tour: [
      { until: 12, move: 0, stale: [], skew: 0, say: "calm market: the cursor runs to the early point and the heartbeat sends" },
      { until: 22, move: 12, stale: [], skew: 0, say: "market rises: a 5 bps move sends at once" },
      { until: 31, move: 12, stale: [2], skew: 0, say: "Bybit stale: the source set changes, priority send" },
      { until: 40, move: 12, stale: [], skew: 0, chain: { halted: true, revoked: false }, say: "chain halted: a send in flight reverts and a send due now fails its gas estimate; nothing renews, and one report later the writer parks and sends nothing" },
    ],
    draw({ leaf, relayer, phase, dt, follow }) {
      const a = relayer.accepted;
      const dev = a && a.price !== null && leaf.price !== null ? (Math.abs(leaf.price - a.price) / a.price) * 10_000 : 0;
      needle(needles[0], S.dials[0], -Math.PI * 0.75 + Math.PI * 1.5 * Math.min(dev / ORACLE.deviationBps / 2, 1));
      const since = relayer.receiptUs === null ? 0 : (leaf.at + phase * ORACLE.periodUs - relayer.receiptUs) / ORACLE.heartbeatUs;
      needle(needles[1], S.dials[1], Math.PI * 2 * clamp(since, 0, 1));

      x.cursor = follow(x.cursor, S.ruler.length * clamp(since, 0, 1), 0.08);
      slide(cursor, x.cursor);

      const loaded = relayer.inFlight !== null;
      x.tile = x.tile.map((v, i) => follow(v, loaded ? S.rack.shift : 0, loaded === (i === 1) ? 0.18 : 0.26));
      tiles.forEach((el, i) => el.setAttribute("transform", translateAlong(D.P, [x.tile[i], 0, 0])));

      if (seen.receiptUs !== undefined && relayer.receiptUs !== seen.receiptUs) seen.receiptFlash = 0.5;
      // A refused or reverted send drops the latch once the vault has reached its failing pin.
      const failed = relayer.refused + relayer.reverted;
      if (seen.failed !== undefined && failed > seen.failed) seen.latchDue = true;
      if (seen.latchDue && phase > 0.8) { seen.latchHold = 0.9; seen.latchDue = false; }
      seen.receiptUs = relayer.receiptUs;
      seen.failed = failed;
      seen.receiptFlash -= dt;
      seen.latchHold -= dt;
      on(lamps.flight, loaded);
      on(lamps.receipt, seen.receiptFlash > 0);
      on(lamps.reverted, seen.latchHold > 0);
      x.bolt = follow(x.bolt, seen.latchHold > 0 ? S.latch.travel : 0, 0.12);
      slide(bolt, x.bolt);

      // A mined revert still uses its nonce, so the wheel never turns back.
      x.wheel = follow(x.wheel, (relayer.nonce * Math.PI * 2) / S.wheel.teeth, 0.2);
      const W = S.wheel, step = (Math.PI * 2) / W.teeth, root = W.r1 - 0.7;
      const pt = (a, r) => iso([W.x + 0.02, W.cy + Math.cos(a) * r, W.cz + Math.sin(a) * r], D.P);
      const ring = [], spokes = [];
      for (let i = 0; i < W.teeth; i++) {
        const g = x.wheel + i * step;
        ring.push(pt(g, root), pt(g + step * 0.85, W.r1), pt(g + step * 0.85, root));
        spokes.push(pathOf([pt(g, W.r0), pt(g, root)]));
      }
      ring.push(ring[0]);
      teeth.setAttribute("d", pathOf(ring) + spokes.join(""));
    },
  };
}

// Vault station: pins run the verifier's checks on each receipt; keys, hasp, gauge and flag follow the chain flags.
{
  const S = D.stations.vault;
  const PINS = S.pins;
  const lamp = $('[data-lamp="vault"]');
  const pinEls = PINS.ys.map((_, i) => $(`[data-name="vault.pin${i}"]`));
  const pinLamps = PINS.ys.map((_, i) => $(`[data-vault-pinlamp="${i}"]`));
  const [bolt, flag, latch, halt] = ["vault.bolt", "vault.flag", "admin.latch", "admin.halt"].map((n) => $(`[data-name="${n}"]`));
  const lampHalt = $('[data-vault-lamp="halt"]');
  const lampRevoke = $('[data-vault-lamp="revoke"]');
  const keyLines = [$('[data-part="vault-gkey"]'), $('[data-part="vault-akey"]')];
  const needleEl = $('[data-part="vault-needle"]');
  // Contract order: the revoke check (pin 4) comes before the halt check (pin 10).
  const failOf = (c) => (c.revoked ? 3 : c.halted ? 9 : -1);
  const KEY = { guardianHalt: -0.87, guardianRevoke: -1.75, adminResume: 0.79 };
  const gauge = { rest: -Math.PI * 0.75, span: Math.PI * 0.5, bps: 20 };
  const now = { pin: PINS.ys.map(() => 0), bolt: 0, flag: 1, halt: 0, latch: 0, gkey: 0, akey: 0, needle: gauge.rest };
  const shown = { pin: PINS.ys.map(() => -1) };
  let prevAt = null, pending = null, run = null, prevChain = null, adminHold = 0, adminTarget = 0;

  const pinSvg = (i, h) => {
    const y = PINS.ys[i];
    const mark = PINS.marks.includes(i) ? lineSvg(ring(PINS.x, y, PINS.r * 0.55, PINS.z + h, D.P, 14), { tone: "lo" }) : "";
    return solidSvg(cylinder(PINS.x, y, PINS.r, PINS.z, h, D.P, 18, 0.15), { tone: "hi", crease: "lo" }) + mark;
  };
  const keyAt = (el, key, a) => {
    const s = Math.sin(a) * key.r, c = Math.cos(a) * key.r;
    el.setAttribute("d", segment([key.x, key.y - s, key.z - c], [key.x, key.y + s, key.z + c], D.P));
  };
  const slide = (el, by) => el.setAttribute("transform", translateAlong(D.P, by));

  STATION_LIVE.vault = {
    tour: [
      { until: 12, move: 0, stale: [], skew: 0, say: "calm: every pin lifts and the bolt slides" },
      { until: 26, move: 0, stale: [], skew: 0, chain: { halted: true }, say: "guardian halts: a send in flight is mined and reverts at the halt pin, or a send due now fails the same pin in its gas estimate; then the writer parks and nothing more is sent" },
      { until: 37, move: 0, stale: [], skew: 0, chain: {}, admin: "resume", say: "admin resumes: the next send lifts every pin again; the replay's writer rejoins at the next report, a running one after its 60 s re-check" },
      { until: 50, move: 0, stale: [], skew: 0, chain: { revoked: true }, say: "guardian revokes: a send in flight or due now fails at the signature pin and later pins idle; the writer parks, only activateEpoch clears a revoke, and the replay resets at the loop start" },
    ],
    draw({ leaf, phase, chain, dt, follow, sent, refused, reverted, relayer, scene }) {
      // A broadcast send is checked when it is mined, at the next report; mined after a flag flips, it
      // reverts at the failing pin. A refused one is the gas estimate's dry run of the same checks, at once.
      if (leaf.at !== prevAt) {
        // A pass runs to its end (p 1.8) across report boundaries; only a new send replaces it.
        if (pending && pending.at === prevAt) run = { at: leaf.at, fail: reverted ? failOf(chain) : -1 };
        pending = null;
        prevAt = leaf.at;
        if (sent && refused) run = { at: leaf.at, fail: failOf(chain) };
        else if (sent) pending = { at: leaf.at };
      }
      if (still.matches) run = { at: leaf.at, fail: failOf(chain) };
      // Reduced motion draws the settled result: every passing pin up, the bolt open.
      const p = run ? (still.matches ? 1.2 : (leaf.at - run.at) / ORACLE.periodUs + phase) : -1;
      if (p >= 1.8) run = null;
      const fail = run ? run.fail : -1;
      const rise = (i) => 0.04 + 0.07 * i;
      const fall = run ? 1 - ease((p - 1.45) / 0.3) : 0;
      const allUp = run && fail < 0;
      PINS.ys.forEach((_, i) => {
        let lift = 0;
        if (run && (fail < 0 || i < fail)) lift = ease((p - rise(i)) / 0.12) * fall;
        else if (run && i === fail) lift = 0.22 * Math.sin(Math.PI * clamp((p - rise(i)) / 0.2, 0, 1));
        now.pin[i] = follow(now.pin[i], lift, 0.06);
        const h = PINS.rest + (PINS.top - PINS.rest) * now.pin[i];
        if (Math.abs(h - shown.pin[i]) > 0.01) { shown.pin[i] = h; pinEls[i].innerHTML = pinSvg(i, h); }
        on(pinLamps[i], run && lift > 0.9 && (fail < 0 || i < fail) && p < 1.5);
        pinLamps[i].toggleAttribute("data-fail", Boolean(run) && i === fail && p > rise(i) && p < 1.5);
      });
      const open = allUp ? ease((p - 0.9) / 0.15) * fall : 0;
      on(lamp, allUp && p > 1.05 && p < 1.45);
      now.bolt = follow(now.bolt, open, 0.05);
      slide(bolt, [-5.4 * now.bolt, 0, 0]);

      // Keys, rocker, hasp and lamps follow the contract's flags.
      if (prevChain) {
        // Only the tour's admin step turns the admin key; a replay reset clears the flags with no key.
        if (prevChain.halted && !chain.halted && scene?.admin === "resume") { adminHold = 2.5; adminTarget = KEY.adminResume; }
      }
      prevChain = { halted: chain.halted, revoked: chain.revoked };
      adminHold = Math.max(0, adminHold - dt);
      now.gkey = follow(now.gkey, chain.revoked ? KEY.guardianRevoke : chain.halted ? KEY.guardianHalt : 0, 0.15);
      now.akey = follow(now.akey, adminHold > 0 ? adminTarget : 0, 0.15);
      keyAt(keyLines[0], S.keys[0], now.gkey);
      keyAt(keyLines[1], S.keys[1], now.akey);
      now.halt = follow(now.halt, chain.halted ? 1.4 : 0, 0.1);
      slide(halt, [0, 0, now.halt]);
      now.latch = follow(now.latch, chain.revoked ? -3 : 0, 0.1);
      slide(latch, [0, now.latch, 0]);
      on(lampHalt, chain.halted);
      on(lampRevoke, chain.revoked);

      // Consumer read: the live checks run again, so a halt, a revoke, a non-VALID leaf or an expired report drops the flag.
      const a = relayer.accepted;
      const nowUs = leaf.at + phase * ORACLE.periodUs;
      const usable = Boolean(a) && a.status === 0 && a.price !== null && !chain.halted && !chain.revoked && nowUs < a.at + ORACLE.ttlUs;
      now.flag = follow(now.flag, usable ? 1 : 0, 0.15);
      slide(flag, [0, 0, (now.flag - 1) * 1.2]);
      const target = usable ? clamp(bpsOf(a.price) / gauge.bps, -1, 1) * gauge.span : gauge.rest;
      now.needle = follow(now.needle, target, 0.25);
      needle(needleEl, S.gauge, now.needle);
    },
  };
}

boot();
</script></body></html>
